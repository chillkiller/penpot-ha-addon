server {
  listen 9001 default_server;
  server_name _;
  proxy_http_version 1.1;
  set  $upstream  http://127.0.0.1:6060;
  # Frontend-Assets (statisch aus /usr/share/nginx/html)
  root  /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }
  location ~* ^/internal/notifications {
    proxy_pass $upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location /api {
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 350m;
  }
  location /rpc {
    proxy_pass $upstream;
    proxy_set_header Host $host;
    client_max_body_size 350m;
  }
  location /assets/ {
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
  location /webhooks/ {
    proxy_pass $upstream;
    proxy_set_header Host $host;
  }
}
