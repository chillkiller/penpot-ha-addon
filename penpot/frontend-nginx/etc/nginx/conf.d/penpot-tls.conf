
# v0.2.23: HTTPS-Listener — Secure Context (Clipboard/WebPush/ServiceWorker)
# Beweis: http://*:9010 bot navigator.clipboard NICHT an (kein secure context);
# https auf 9443 (exposed als 9443) erzeugt den Context im Browser.
server {
    listen 9443 ssl;
    http2 on;

    root /usr/share/nginx/html/app/;
    index index.html;

    ssl_certificate     /data/penpot/tls/penpot.crt;
    ssl_certificate_key /data/penpot/tls/penpot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # die Kern-Routen identisch zum HTTP-Server (8099/9001)
    location /api { proxy_pass http://penpot_backend; proxy_buffering off; }
    location /rpc { proxy_pass http://penpot_backend; proxy_buffering off; }
    location /assets { proxy_pass http://penpot_backend; }
    location /readyz { proxy_pass http://penpot_backend; }
    location /ws/notifications { proxy_pass http://penpot_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
    location /mcp/ws { proxy_pass $mcp_ws_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
    location /mcp/stream { proxy_pass $mcp_stream_backend; }
    location /mcp/sse { proxy_pass $mcp_sse_backend; }
    location = /mcp { proxy_pass $mcp_backend; }
    location /plugins/ { alias /usr/share/nginx/html/app/plugins/; }
    location /internal/gfonts { include /etc/nginx/overrides/location.d/*.conf; }
    location /internal/assets { internal; alias /data/penpot/assets; }
    location = /js/config.js { proxy_pass http://127.0.0.1:9002/js/config.js; proxy_set_header Accept-Encoding ""; sub_filter_once on; sub_filter_types text/javascript application/javascript; sub_filter '//var penpotPublicURI = "";' 'var penpotPublicURI = window.location.origin + "$http_x_ingress_path";'; }
    location / { try_files $uri /index.html; include /etc/nginx/overrides/location.d/*.conf; }
}
