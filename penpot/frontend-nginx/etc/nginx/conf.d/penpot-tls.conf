
# v0.2.23: HTTPS-Listener — Secure Context (Clipboard/WebPush/ServiceWorker)
# Beweis: http://*:9010 bot navigator.clipboard NICHT an (kein secure context);
# https auf 9443 (exposed als 9443) erzeugt den Context im Browser.
server {
    listen 9443 ssl;
    http2 on;

    root /usr/share/nginx/html/app/;
    index index.html;

    ssl_certificate     /data/penpot/tls/penpot.crt;
    ssl_certificate_key /data/penpot/tls/penpot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # die Kern-Routen: EXAKT die Verkabelung aus penpot.conf (set+proxy_pass direkt, keine upstreams)
    location = /readyz { proxy_pass http://127.0.0.1:6060; }
    location /assets { proxy_pass http://127.0.0.1:6060; }
    location /api/export { proxy_pass http://127.0.0.1:6061; }
    location /api { proxy_pass http://127.0.0.1:6060; proxy_buffering off; }
    location /rpc { proxy_pass http://127.0.0.1:6060; proxy_buffering off; }
    location /ws/notifications { proxy_pass http://127.0.0.1:6060; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
    location = /mcp/ws { proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; set $mcp_ws_backend http://127.0.0.1:4402; proxy_pass $mcp_ws_backend; proxy_http_version 1.1; }
    location = /mcp/stream { set $mcp_stream_backend http://127.0.0.1:4401/mcp$is_args$args; proxy_pass $mcp_stream_backend; proxy_http_version 1.1; }
    location = /mcp/sse { set $mcp_sse_backend http://127.0.0.1:4401/sse$is_args$args; proxy_pass $mcp_sse_backend; proxy_http_version 1.1; proxy_ignore_headers Set-Cookie Vary Cache-Control Expires; add_header Access-Control-Allow-Origin $http_origin; add_header Cache-Control max-age=86400; }
    location = /mcp { proxy_pass http://127.0.0.1:4401; proxy_http_version 1.1; proxy_buffering off; }
    location /plugins/ { alias /usr/share/nginx/html/app/plugins/; }
    location /internal/assets { internal; alias /data/penpot/assets; }
    location /internal/gfonts { include /etc/nginx/overrides/location.d/external-locations.conf; }
    location = /js/config.js { proxy_pass http://127.0.0.1:9002/js/config.js; proxy_set_header Accept-Encoding ""; sub_filter '//var penpotPublicURI = "";' 'var penpotPublicURI = window.location.origin + "$http_x_ingress_path";'; }
    location / { include /etc/nginx/overrides/location.d/external-locations.conf; try_files $uri /index.html; }
}
