name: Penpot
version: "0.2.0"
slug: penpot
description: Penpot design platform (full stack in add-on container, Debian basis)
url: https://penpot.app
arch: [aarch64]
startup: services
init: false
panel_icon: mdi:palette
panel_title: Penpot
panel_admin: false
ingress: true
# Frontend UI via ports (LAN + Nabu via ingress)
ports:
  "9001/tcp": 9001
  "6060/tcp": null
  "6061/tcp": null
ports_description:
  "9001/tcp": Penpot frontend UI (ingress + LAN)
  "6060/tcp": Backend HTTP (intern)
map:
  - data:rw
environment:
  PENPOT_FLAGS: "disable-email-verification disable-secure-session-cookies enable-prepl-server enable-mcp"
  PENPOT_DATABASE_URI: "postgresql://127.0.0.1:5433/penpot"
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_REDIS_URI: "redis://127.0.0.1:6380/0"
  PENPOT_PUBLIC_URI: "http://localhost:9001"
  PENPOT_ASSETS_STORAGE_BACKEND: local
  PENPOT_ASSETS_STORAGE_LOCAL_DIR: /data/penpot/assets
schema:
  penpot_flags: str?
