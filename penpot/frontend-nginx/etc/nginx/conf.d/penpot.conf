# Penpot frontend server — 1:1 aus penpotapp/frontend 2.18.3 (nginx.conf.template),
# Ports intern beibehalten (6060 backend, 6061 exporter, 4401/4402 mcp),
# Server-Port 9001 (Addon-Konvention), same-origin (Ingress + LAN kompatibel).
upstream penpot_backend {
    server 127.0.0.1:6060;
}
upstream penpot_exporter {
    server 127.0.0.1:6061;
}
upstream penpot_mcp_http {
    server 127.0.0.1:4401;
}
upstream penpot_mcp_ws {
    server 127.0.0.1:4402;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Interner Nur-File-Server (:9002) — dient config.js für den sub_filter-Loop:
server {
    listen 127.0.0.1:9002;
    server_name _;
    root /usr/share/nginx/html/app/;
    gzip off;
    location = /js/config.js {
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/javascript";
    }
    location / {
        return 404;
    }
}

server {
    # 8099 = HA-Ingress-Port (HA proxyt dort hin), 9001 = LAN/Port-Map (Host 9010)
    listen 8099 default_server;
    listen 9001 default_server;
    server_name _;

    client_max_body_size 350m;
    charset utf-8;

    etag off;
    proxy_hide_header X-Powered-By;

    # Upstream-Docroot exakt wie penpotapp/frontend (Multi-Stage-Copy):
    root /usr/share/nginx/html/app/;

    include /etc/nginx/nginx-security-headers.conf;

    # Upstream-Header-Zeile wie im originalen nginx.conf.template:
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /readyz {
        access_log off;
        proxy_pass http://penpot_backend;
    }

    location /assets {
        proxy_pass http://penpot_backend;
    }

    location /internal/assets {
        internal;
        alias /data/penpot/assets;
    }

    location /api/export {
        proxy_pass http://penpot_exporter;
    }

    location /api {
        proxy_pass http://penpot_backend;
        proxy_buffering off;
    }

    location /rpc {
        proxy_pass http://penpot_backend;
        proxy_buffering off;
    }

    location /ws/notifications {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://penpot_backend;
    }

    # MCP-Endpunkte — exakt aus Penpots nginx-mcp-locations.conf.template:
    location = /mcp/ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        set $mcp_ws_backend http://127.0.0.1:4402;
        proxy_pass $mcp_ws_backend;
        proxy_http_version 1.1;
    }

    location = /mcp/stream {
        set $mcp_stream_backend http://127.0.0.1:4401/mcp$is_args$args;
        proxy_pass $mcp_stream_backend;
        proxy_http_version 1.1;
    }

    location = /mcp/sse {
        set $mcp_sse_backend http://127.0.0.1:4401/sse$is_args$args;
        proxy_pass $mcp_sse_backend;
        proxy_http_version 1.1;
        proxy_ignore_headers Set-Cookie Vary Cache-Control Expires;
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Cache-Control max-age=86400;
    }

    # Modern Streamable HTTP endpoint (POST/GET/DELETE auf /mcp):
    location = /mcp {
        proxy_pass http://127.0.0.1:4401;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /plugins/ {
        alias /usr/share/nginx/html/app/plugins/;
    }

    # Interner File-Server (9002) — nur dafür, dass sub_filter bei config.js greift:
    location = /js/config.js {
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, max-age=0" always;
        # Ingress: penpotPublicURI = origin + X-Ingress-Path (penpot-issue#7384) —
        # sub_filter wirkt NUR bei proxied responses, deshalb der loop über :9002:
        proxy_pass http://127.0.0.1:9002/js/config.js;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter_types text/javascript application/javascript;
        sub_filter '//var penpotPublicURI = "";' 'var penpotPublicURI = window.location.origin + "$http_x_ingress_path";';
    }

    location ~* \.(js|css|jpg|png|svg|gif|ttf|woff|woff2|wasm|map)$ {
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = / {
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, max-age=0" always;
        try_files /index.html =404;
    }

    # HA-Ingress übermittelt den PRAEFIX ungestript (/api/hassio_ingress/<token>/…).
    # Wir strippen X-Ingress-Path selbst und intern re-distribueren:
    location ~ ^/api/hassio_ingress/[^/]+(/.*)$ {
        rewrite ^/api/hassio_ingress/[^/]+(/.*)$ $1 last;
    }

    location / {
        include /etc/nginx/overrides/location.d/*.conf;
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-store, no-cache, max-age=0" always;
        try_files $uri /index.html$is_args$args /index.html =404;
    }
}